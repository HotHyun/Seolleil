services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: korean_ski
      POSTGRES_PASSWORD: korean_ski_test
      POSTGRES_DB: korean_ski_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korean_ski -d korean_ski_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

